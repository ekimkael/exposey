<svg width="330" height="320" viewBox="0 0 330 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="railFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d0d0d0"/>
    </linearGradient>
    <linearGradient id="glassMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f8f8f8"/>
      <stop offset="100%" stop-color="#c8c8c8"/>
    </linearGradient>
    <linearGradient id="glassFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bebebe"/>
    </linearGradient>
  </defs>

  <!-- Phone outline -->
  <path d="M 50 300 L 50 60 Q 50 20 90 20 L 240 20 Q 280 20 280 60 L 280 300"
        fill="none" stroke="url(#railFade)" stroke-width="1.4"/>

  <!-- Dynamic Island -->
  <rect x="130" y="34" width="70" height="22" rx="11" fill="#ffffff" fill-opacity="0.14"/>

  <!-- Date -->
  <text x="165" y="90" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif"
        font-size="14" fill="#ffffff" fill-opacity="0.80">Tue Sep 24</text>

  <!-- Time -->
  <text x="165" y="155" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', Helvetica, Arial, sans-serif"
        font-size="56" font-weight="200" letter-spacing="-2" fill="#ffffff" fill-opacity="0.95">09:41</text>

  <!-- Back card (calendar) -->
  <rect x="58" y="182" width="214" height="44" rx="16" fill="url(#glassBack)" stroke="#000000" stroke-opacity="0.08" stroke-width="0.8"/>
  <line x1="74" y1="183" x2="254" y2="183" stroke="#ffffff" stroke-opacity="0.60" stroke-width="0.8"/>
  <rect x="72" y="192" width="14" height="14" rx="3" fill="none" stroke="#000" stroke-opacity="0.40" stroke-width="1.4"/>
  <line x1="72" y1="197" x2="86" y2="197" stroke="#000" stroke-opacity="0.40" stroke-width="1.4"/>
  <line x1="77" y1="189" x2="77" y2="194" stroke="#000" stroke-opacity="0.40" stroke-width="1.4"/>
  <line x1="81" y1="189" x2="81" y2="194" stroke="#000" stroke-opacity="0.40" stroke-width="1.4"/>
  <text x="94" y="201" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="12" fill="#000" fill-opacity="0.50">Calendar</text>
  <text x="94" y="216" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="11" fill="#000" fill-opacity="0.38">Design review · 10:00 AM</text>

  <!-- Mid card (location) -->
  <rect x="42" y="196" width="246" height="54" rx="18" fill="url(#glassMid)" stroke="#000000" stroke-opacity="0.08" stroke-width="0.8"/>
  <line x1="60" y1="197" x2="270" y2="197" stroke="#ffffff" stroke-opacity="0.60" stroke-width="0.8"/>
  <g transform="translate(60, 210)" stroke="#000" stroke-opacity="0.50" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="7" r="3"/>
    <path d="M8 0 a8 8 0 0 1 8 8 c0 5.5 -8 14 -8 14 S0 13.5 0 8 a8 8 0 0 1 8 -8 z"/>
  </g>
  <text x="86" y="219" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#000">Pick up groceries</text>
  <text x="86" y="236" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="11" fill="#000" fill-opacity="0.55">Near Whole Foods · Now</text>

  <!-- Front card (main reminder) -->
  <rect x="26" y="210" width="278" height="78" rx="20" fill="url(#glassFront)" stroke="#000000" stroke-opacity="0.10" stroke-width="0.8"/>
  <line x1="44" y1="211" x2="286" y2="211" stroke="#ffffff" stroke-opacity="0.70" stroke-width="1"/>

  <!-- Bell icon -->
  <g transform="translate(44, 228)" stroke="#000" stroke-opacity="0.60" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 0 C9 0 17 3 17 11 L17 17 L1 17 L1 11 C1 3 9 0 9 0 Z"/>
    <line x1="-1" y1="17" x2="19" y2="17"/>
    <path d="M6 20 a3 3 0 0 0 6 0"/>
  </g>

  <text x="74" y="245" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#000">Standup Meeting</text>
  <text x="74" y="261" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="12" fill="#000" fill-opacity="0.60">In 15 minutes · Floor 3, Room B</text>

  <!-- Action buttons -->
  <rect x="42" y="272" width="98" height="22" rx="11" fill="#000000" fill-opacity="0.07"/>
  <text x="91" y="287" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="11" fill="#000" fill-opacity="0.50">Snooze</text>
  <rect x="148" y="272" width="110" height="22" rx="11" fill="#000000" fill-opacity="0.07"/>
  <text x="203" y="287" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="11" fill="#000" fill-opacity="0.50">Mark Done</text>
</svg>
