<svg width="330" height="320" viewBox="0 0 330 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="railFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Phone outline -->
  <path d="M 50 300 L 50 60 Q 50 20 90 20 L 240 20 Q 280 20 280 60 L 280 300"
        fill="none" stroke="url(#railFade)" stroke-width="1.4"/>

  <!-- Dynamic Island -->
  <rect x="130" y="34" width="70" height="22" rx="11" fill="#ffffff" fill-opacity="0.14"/>

  <!-- Status bar time -->
  <text x="74" y="65" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif"
        font-size="12" font-weight="600" fill="#ffffff" fill-opacity="0.80">9:41</text>

  <!-- App title -->
  <text x="165" y="95" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', Helvetica, Arial, sans-serif"
        font-size="18" font-weight="700" fill="#ffffff" fill-opacity="0.95">Grocery List</text>

  <!-- Avatars -->
  <circle cx="136" cy="122" r="14" fill="#ffffff" fill-opacity="0.22"/>
  <text x="136" y="127" text-anchor="middle" font-family="-apple-system" font-size="10" font-weight="600" fill="#ffffff">EK</text>
  <circle cx="163" cy="122" r="14" fill="#ffffff" fill-opacity="0.17"/>
  <text x="163" y="127" text-anchor="middle" font-family="-apple-system" font-size="10" font-weight="600" fill="#ffffff">SA</text>
  <circle cx="190" cy="122" r="14" fill="#ffffff" fill-opacity="0.13"/>
  <text x="190" y="127" text-anchor="middle" font-family="-apple-system" font-size="10" font-weight="600" fill="#ffffff">JB</text>
  <circle cx="217" cy="122" r="14" fill="#ffffff" fill-opacity="0.09"/>
  <text x="217" y="127" text-anchor="middle" font-family="-apple-system" font-size="10" fill="#ffffff" fill-opacity="0.70">+2</text>

  <!-- Item 1 - checked -->
  <rect x="56" y="150" width="218" height="36" rx="13" fill="#ffffff" fill-opacity="0.88"/>
  <circle cx="76" cy="168" r="8" fill="none" stroke="#000" stroke-opacity="0.20" stroke-width="1.5"/>
  <polyline points="71,168 75,172 82,163" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="172" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="13" fill="#000" fill-opacity="0.35" text-decoration="line-through">Milk &amp; eggs</text>

  <!-- Item 2 - checked -->
  <rect x="56" y="194" width="218" height="36" rx="13" fill="#ffffff" fill-opacity="0.84"/>
  <circle cx="76" cy="212" r="8" fill="none" stroke="#000" stroke-opacity="0.20" stroke-width="1.5"/>
  <polyline points="71,212 75,216 82,207" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="216" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="13" fill="#000" fill-opacity="0.35" text-decoration="line-through">Orange juice</text>

  <!-- Item 3 - unchecked, active -->
  <rect x="56" y="238" width="218" height="36" rx="13" fill="#ffffff" fill-opacity="0.96"/>
  <circle cx="76" cy="256" r="8" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="1.5"/>
  <text x="94" y="260" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#000">Coffee beans</text>

  <!-- Item 4 - unchecked -->
  <rect x="56" y="282" width="218" height="36" rx="13" fill="#ffffff" fill-opacity="0.68"/>
  <circle cx="76" cy="300" r="8" fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="1.5"/>
  <text x="94" y="304" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="13" fill="#000" fill-opacity="0.65">Greek yogurt</text>
</svg>
