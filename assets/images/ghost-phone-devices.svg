<svg width="330" height="320" viewBox="0 0 330 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="railFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d4d4d4"/>
    </linearGradient>
  </defs>

  <!-- Phone outline -->
  <path d="M 50 300 L 50 60 Q 50 20 90 20 L 240 20 Q 280 20 280 60 L 280 300"
        fill="none" stroke="url(#railFade)" stroke-width="1.4"/>

  <!-- Dynamic Island -->
  <rect x="130" y="34" width="70" height="22" rx="11" fill="#ffffff" fill-opacity="0.14"/>

  <!-- Header -->
  <text x="165" y="90" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif"
        font-size="14" fill="#ffffff" fill-opacity="0.75">All Devices</text>
  <!-- iCloud icon -->
  <g transform="translate(141, 100)" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.4" stroke-linecap="round">
    <path d="M6 14 H2 a6 6 0 0 1 -1 -12 a8 8 0 0 1 16 1 a5 5 0 0 1 1 11 H20"/>
  </g>
  <text x="165" y="128" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif"
        font-size="12" fill="#ffffff" fill-opacity="0.45">4 devices synced</text>

  <!-- Watch card -->
  <rect x="62" y="148" width="94" height="60" rx="14" fill="url(#card)" stroke="#000" stroke-opacity="0.08" stroke-width="0.8"/>
  <line x1="76" y1="149" x2="142" y2="149" stroke="#ffffff" stroke-opacity="0.60" stroke-width="0.8"/>
  <!-- Watch icon -->
  <rect x="98" y="158" width="14" height="18" rx="4" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="1.4"/>
  <line x1="100" y1="156" x2="108" y2="156" stroke="#000" stroke-opacity="0.30" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="178" x2="108" y2="178" stroke="#000" stroke-opacity="0.30" stroke-width="2" stroke-linecap="round"/>
  <circle cx="105" cy="167" r="1.5" fill="#000" fill-opacity="0.40"/>
  <text x="109" y="200" text-anchor="middle" font-family="-apple-system" font-size="10" fill="#000" fill-opacity="0.55">Watch</text>
  <circle cx="148" cy="157" r="4" fill="#34c759" fill-opacity="0.80"/>

  <!-- iPad card -->
  <rect x="164" y="148" width="94" height="60" rx="14" fill="url(#card)" stroke="#000" stroke-opacity="0.08" stroke-width="0.8"/>
  <line x1="178" y1="149" x2="244" y2="149" stroke="#ffffff" stroke-opacity="0.60" stroke-width="0.8"/>
  <!-- iPad icon -->
  <rect x="200" y="157" width="18" height="22" rx="3" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="1.4"/>
  <circle cx="209" cy="181" r="1.8" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="1.2"/>
  <text x="211" y="200" text-anchor="middle" font-family="-apple-system" font-size="10" fill="#000" fill-opacity="0.55">iPad</text>
  <circle cx="250" cy="157" r="4" fill="#34c759" fill-opacity="0.80"/>

  <!-- iPhone card -->
  <rect x="62" y="216" width="94" height="60" rx="14" fill="url(#card)" stroke="#000" stroke-opacity="0.08" stroke-width="0.8"/>
  <line x1="76" y1="217" x2="142" y2="217" stroke="#ffffff" stroke-opacity="0.60" stroke-width="0.8"/>
  <!-- iPhone icon -->
  <rect x="100" y="225" width="12" height="22" rx="3" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="1.4"/>
  <rect x="103" y="227" width="6" height="2" rx="1" fill="#000" fill-opacity="0.30"/>
  <circle cx="106" cy="244" r="1.5" fill="none" stroke="#000" stroke-opacity="0.30" stroke-width="1"/>
  <text x="109" y="268" text-anchor="middle" font-family="-apple-system" font-size="10" fill="#000" fill-opacity="0.55">iPhone</text>
  <circle cx="148" cy="225" r="4" fill="#34c759" fill-opacity="0.80"/>

  <!-- Mac card -->
  <rect x="164" y="216" width="94" height="60" rx="14" fill="url(#card)" stroke="#000" stroke-opacity="0.08" stroke-width="0.8"/>
  <line x1="178" y1="217" x2="244" y2="217" stroke="#ffffff" stroke-opacity="0.60" stroke-width="0.8"/>
  <!-- MacBook icon -->
  <rect x="196" y="228" width="26" height="16" rx="2" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="1.4"/>
  <line x1="192" y1="246" x2="226" y2="246" stroke="#000" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
  <rect x="202" y="247" width="14" height="2" rx="1" fill="#000" fill-opacity="0.20"/>
  <text x="211" y="268" text-anchor="middle" font-family="-apple-system" font-size="10" fill="#000" fill-opacity="0.55">Mac</text>
  <circle cx="250" cy="225" r="4" fill="#34c759" fill-opacity="0.80"/>

  <!-- Bottom sync status -->
  <rect x="72" y="286" width="186" height="22" rx="11" fill="#ffffff" fill-opacity="0.10"/>
  <circle cx="92" cy="297" r="4" fill="#34c759" fill-opacity="0.75"/>
  <text x="104" y="301" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="11" fill="#ffffff" fill-opacity="0.60">Synced just now via iCloud</text>
</svg>
