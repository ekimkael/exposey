<svg width="330" height="320" viewBox="0 0 330 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="railFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glassBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#d0d0d0" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="glassMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f8f8f8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#c8c8c8" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="glassFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#bebebe" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Ghost phone outline -->
  <path d="M 50 300 L 50 60 Q 50 20 90 20 L 240 20 Q 280 20 280 60 L 280 300"
        fill="none" stroke="url(#railFade)" stroke-width="1.4"/>

  <!-- Dynamic Island -->
  <rect x="130" y="34" width="70" height="22" rx="11" fill="#ffffff" fill-opacity="0.14"/>

  <!-- Date -->
  <text x="165" y="92" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif"
        font-size="14" fill="#ffffff" fill-opacity="0.8">Wed Sep 24</text>

  <!-- Time -->
  <text x="165" y="158" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', Helvetica, Arial, sans-serif"
        font-size="58" font-weight="200" letter-spacing="-2" fill="#ffffff" fill-opacity="0.95">02:39</text>

  <!-- back card -->
  <rect x="54" y="178" width="222" height="44" rx="18" fill="url(#glassBack)" stroke="#000000" stroke-opacity="0.10" stroke-width="0.8"/>
  <line x1="72" y1="179" x2="258" y2="179" stroke="#ffffff" stroke-opacity="0.60" stroke-width="0.8"/>
  <g stroke="#000000" stroke-opacity="0.45" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 186 l-3 4 v14 a2 2 0 0 0 2 2 h14 a2 2 0 0 0 2 -2 v-14 l-3 -4 Z"/>
    <line x1="67" y1="190" x2="85" y2="190"/>
    <path d="M80 194 a4 4 0 0 1 -8 0"/>
  </g>

  <!-- mid card -->
  <rect x="40" y="190" width="250" height="56" rx="18" fill="url(#glassMid)" stroke="#000000" stroke-opacity="0.10" stroke-width="0.8"/>
  <line x1="58" y1="191" x2="272" y2="191" stroke="#ffffff" stroke-opacity="0.60" stroke-width="0.8"/>
  <g stroke="#000000" stroke-opacity="0.55" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="56,200 59,203 67,195"/>
    <path d="M66 201 v6 a2 2 0 0 1 -2 2 H52 a2 2 0 0 1 -2 -2 v-12 a2 2 0 0 1 2 -2 h9"/>
  </g>

  <!-- front card -->
  <rect x="24" y="204" width="282" height="78" rx="18" fill="url(#glassFront)" stroke="#000000" stroke-opacity="0.10" stroke-width="0.8"/>
  <line x1="42" y1="205" x2="288" y2="205" stroke="#ffffff" stroke-opacity="0.70" stroke-width="1"/>

  <!-- pencil icon -->
  <g transform="translate(30, 222)" stroke="#000000" stroke-opacity="0.60" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2 l4 4 L6 16 L2 18 L4 14 Z"/>
    <line x1="10" y1="4" x2="14" y2="8"/>
  </g>
  <text x="54" y="237" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#000000">Review project proposal</text>
  <text x="54" y="253" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif" font-size="12" fill="#000000" fill-opacity="0.60">Today at 5:00 PM &#183; Work</text>
  <circle cx="284" cy="243" r="11" fill="none" stroke="#000000" stroke-opacity="0.30" stroke-width="1.5"/>
  <polyline points="279,243 283,247 290,239" fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
